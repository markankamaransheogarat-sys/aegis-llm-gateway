[package]
name = "aegis-llm-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Commercial-grade AI Cost & Security Gateway in Rust: L1/L2 semantic cache, secret redaction, prompt-injection WAF, USD budgets & offline Pro licensing"
license = "MIT OR Apache-2.0"
repository = "https://github.com/markankamaransheogarat-sys/aegis-llm-gateway"
keywords = ["llm", "gateway", "security", "cache", "ai-infra"]
categories = ["network-programming", "web-programming", "command-line-utilities"]

[dependencies]
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
futures-util = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"
